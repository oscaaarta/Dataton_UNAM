<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <title>MATA estudio floral</title>
  <!-- Rama decorativa verde olivo -->
  <g fill="none" stroke="#6B7A3A" stroke-width="2.2" stroke-linecap="round">
    <path d="M40 120 C 60 90, 70 60, 72 30"/>
  </g>
  <g fill="#6B7A3A">
    <ellipse cx="62" cy="96" rx="9" ry="4" transform="rotate(-40 62 96)"/>
    <ellipse cx="74" cy="84" rx="9" ry="4" transform="rotate(30 74 84)"/>
    <ellipse cx="66" cy="70" rx="8" ry="3.6" transform="rotate(-45 66 70)"/>
    <ellipse cx="77" cy="58" rx="8" ry="3.6" transform="rotate(35 77 58)"/>
    <ellipse cx="69" cy="45" rx="7" ry="3.2" transform="rotate(-50 69 45)"/>
  </g>
  <!-- Flor borgoña con centro rosa pastel -->
  <g transform="translate(72 30)">
    <circle r="7" cx="0" cy="-8" fill="#7A1F3D"/>
    <circle r="7" cx="7.6" cy="-2.5" fill="#7A1F3D"/>
    <circle r="7" cx="4.7" cy="6.5" fill="#7A1F3D"/>
    <circle r="7" cx="-4.7" cy="6.5" fill="#7A1F3D"/>
    <circle r="7" cx="-7.6" cy="-2.5" fill="#7A1F3D"/>
    <circle r="4.5" fill="#F4C7CF"/>
  </g>
  <!-- Wordmark -->
  <text x="110" y="92" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="68" font-weight="600" letter-spacing="10" fill="#7A1F3D">MATA</text>
  <text x="114" y="124" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="6.5" fill="#6B7A3A">ESTUDIO FLORAL</text>
</svg>
